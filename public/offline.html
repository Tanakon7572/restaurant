<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ออฟไลน์ | Food Order POS</title>
  <style>
    body {
      margin: 0; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      font-family: "IBM Plex Sans Thai", system-ui, sans-serif;
      background: #f5f6f8; color: #2b2521; text-align: center; padding: 24px;
    }
    .card { max-width: 320px; }
    h1 { font-size: 1.15rem; margin: 0 0 8px; }
    p { font-size: 0.9rem; color: #6b625c; line-height: 1.6; margin: 0 0 20px; }
    button {
      font: inherit; font-weight: 600; cursor: pointer;
      background: #c4653f; color: #fff; border: 0;
      padding: 12px 24px; border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size:2.5rem;line-height:1;margin-bottom:12px">📡</div>
    <h1>ไม่ได้เชื่อมต่ออินเทอร์เน็ต</h1>
    <p>
      หน้านี้ต้องใช้ข้อมูลสด เมื่อเน็ตกลับมาให้กดลองใหม่<br>
      ออเดอร์ที่บันทึกไว้ตอนออฟไลน์จะถูกส่งให้เองอัตโนมัติ
    </p>
    <button onclick="location.reload()">ลองใหม่</button>
  </div>
</body>
</html>
